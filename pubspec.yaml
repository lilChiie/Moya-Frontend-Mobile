name: moya_mobile
description: "MOYA - AI-Powered Accessible Tourism Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  geolocator: ^14.0.2
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  image_picker: ^1.2.1
  http: ^1.6.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo/app_icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo/
    - assets/images/empty_states/
    - assets/images/mascot/
    - assets/images/other/
    - assets/images/avatar/
    - assets/animations/